<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050907">
<title>WorkHive — Task Verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g1:#00E676;--g2:#00C853;--g3:#009A3F;
  --bg:#050907;--ink:#EAF7EF;--ink2:#9BB5A5;--ink3:#5E7667;
  --glass:rgba(255,255,255,.055);--glass-b:rgba(255,255,255,.12);
  --red:#FF5252;--amber:#FFB300;
  font-family:'Plus Jakarta Sans','Noto Sans Bengali',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(60% 45% at 18% 8%,rgba(0,230,118,.22),transparent 70%),
             radial-gradient(50% 40% at 92% 30%,rgba(0,200,83,.14),transparent 70%),
             radial-gradient(70% 50% at 50% 110%,rgba(0,154,63,.25),transparent 70%)}

/* ───────── Premium 3D loader ───────── */
#loader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:var(--bg);
  transition:opacity .55s ease,visibility .55s ease}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.orb{position:relative;width:104px;height:104px;perspective:560px}
.orb .ring{position:absolute;inset:0;border-radius:50%;border:5px solid transparent;
  border-top-color:var(--g1);border-right-color:var(--g2);
  box-shadow:0 0 24px rgba(0,230,118,.45),inset 0 0 18px rgba(0,230,118,.25);
  transform-style:preserve-3d;animation:spin3d 1.15s linear infinite}
.orb .ring.r2{inset:13px;border-top-color:var(--g2);border-right-color:transparent;border-bottom-color:var(--g1);animation-duration:.9s;animation-direction:reverse}
.orb .ring.r3{inset:27px;border-width:4px;border-top-color:#B9FFD9;border-right-color:transparent;animation-duration:.7s}
.orb .core{position:absolute;inset:38px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#B9FFD9,var(--g1) 38%,var(--g3) 100%);
  box-shadow:0 8px 22px rgba(0,200,83,.65),inset 0 -6px 10px rgba(0,60,25,.55);animation:pulse 1.15s ease-in-out infinite}
@keyframes spin3d{from{transform:rotateX(62deg) rotateZ(0)}to{transform:rotateX(62deg) rotateZ(360deg)}}
.orb .ring.r2{animation-name:spin3dB}
@keyframes spin3dB{from{transform:rotateY(62deg) rotateZ(0)}to{transform:rotateY(62deg) rotateZ(-360deg)}}
@keyframes pulse{50%{transform:scale(.82);filter:brightness(1.25)}}
.ld-title{font-weight:800;font-size:18px;letter-spacing:.2px}
.ld-sub{font-size:12.5px;color:var(--ink2);margin-top:6px;text-align:center;min-height:18px}
@media (prefers-reduced-motion:reduce){.orb .ring,.orb .core{animation:none}}

/* ───────── Layout / glass ───────── */
main{max-width:460px;margin:0 auto;padding:26px 16px 40px;opacity:0;transform:translateY(8px);transition:opacity .6s ease .1s,transform .6s ease .1s}
main.show{opacity:1;transform:none}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.brand-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#03140A;
  background:linear-gradient(145deg,var(--g1),var(--g2));box-shadow:0 6px 18px rgba(0,230,118,.4),inset 0 1px 0 rgba(255,255,255,.55)}
.brand b{font-size:17px;font-weight:800}
.glass{background:var(--glass);border:1px solid var(--glass-b);border-radius:22px;padding:20px;
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1)}
h1{font-size:21px;line-height:1.3;font-weight:800;letter-spacing:-.2px}
.muted{color:var(--ink2);font-size:13px;line-height:1.6;margin-top:6px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.bdg{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--glass-b);text-align:center}
.bdg small{font-size:11px;color:var(--ink2);font-weight:600}
.bdg strong{font-size:13px;font-weight:800}
/* 3D badge icon: glossy bevelled disc with a layered base */
.b3d{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 24%,#8CFFC0 0,var(--g1) 34%,var(--g2) 68%,var(--g3) 100%);
  box-shadow:0 7px 0 #00752F,0 12px 18px rgba(0,200,83,.45),inset 0 2px 3px rgba(255,255,255,.7),inset 0 -4px 6px rgba(0,70,28,.45);
  transform:translateY(-3px)}
.b3d::after{content:"";position:absolute;top:4px;left:9px;width:18px;height:9px;border-radius:50%;background:linear-gradient(rgba(255,255,255,.75),transparent)}
.b3d svg{width:22px;height:22px;stroke:#04200E;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1}
.timer{margin:6px 0 4px;text-align:center}
.timer .num{font-size:54px;font-weight:800;line-height:1;background:linear-gradient(180deg,#fff,var(--g1));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--g2),var(--g1));box-shadow:0 0 14px rgba(0,230,118,.6);transition:width .4s linear}
button,.btn{appearance:none;border:0;cursor:pointer;width:100%;padding:15px;border-radius:15px;font:800 15px inherit;font-family:inherit;color:#03140A;text-align:center;text-decoration:none;display:block;
  background:linear-gradient(145deg,var(--g1),var(--g2));box-shadow:0 8px 0 #00752F,0 14px 24px rgba(0,200,83,.35);transition:transform .12s,box-shadow .12s}
button:active,.btn:active{transform:translateY(5px);box-shadow:0 3px 0 #00752F,0 6px 12px rgba(0,200,83,.3)}
button:focus-visible,.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
button.ghost{background:rgba(255,255,255,.07);color:var(--ink);box-shadow:none;border:1px solid var(--glass-b);margin-top:10px;font-weight:700}
.code{margin:16px 0 12px;padding:18px 10px;border-radius:16px;text-align:center;font:800 26px 'Plus Jakarta Sans',monospace;letter-spacing:1.5px;word-break:break-all;color:var(--g1);
  background:rgba(0,230,118,.08);border:1.5px dashed rgba(0,230,118,.55);user-select:all}
.state{text-align:center;padding:6px 0}
.state .big{font-size:42px;margin-bottom:10px}
.err{color:var(--red)} .warn{color:var(--amber)}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="loader" role="status" aria-live="polite">
  <div class="orb" aria-hidden="true"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"></div></div>
  <div style="text-align:center"><div class="ld-title">WorkHive</div><div class="ld-sub" id="ldSub">Verifying secure session…</div></div>
</div>

<main id="app">
  <div class="brand"><div class="brand-mark">W</div><b>WorkHive</b></div>
  <section class="glass" id="card"></section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCeA-269WRHJCehg9Z__tlre_EbZcfanlY",
  authDomain: "workhive-35207.firebaseapp.com",
  projectId: "workhive-35207",
  storageBucket: "workhive-35207.firebasestorage.app",
  messagingSenderId: "567915693960",
  appId: "1:567915693960:web:db6b3c3165c125c8d51c3d"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const JOB_ID = (params.get('job_id') || '').replace(/[^\w-]/g, '');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON = {
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  lock:'<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  coin:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.2c-.6-.8-1.5-1.2-2.5-1.2-1.4 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1.1 2-2.5 2c-1 0-2-.4-2.5-1.2M12 6.5V8m0 8v1.5"/></svg>'
};
const b3 = (ico, label, val) => `<div class="bdg"><div class="b3d">${ICON[ico]}</div><strong>${val}</strong><small>${label}</small></div>`;

/* ── Loader: dynamic verification state, hidden after max 1 second ── */
const t0 = performance.now();
let loaderHidden = false;
const msgs = ['Verifying secure session…', 'Checking task status…', 'Almost ready…'];
let mi = 0; const msgTimer = setInterval(() => { $('ldSub').textContent = msgs[++mi % msgs.length]; }, 330);
function hideLoader() {
  if (loaderHidden) return; loaderHidden = true; clearInterval(msgTimer);
  $('loader').classList.add('hide'); $('app').classList.add('show');
  setTimeout(() => $('loader').remove(), 700);
}
setTimeout(hideLoader, 1000);                       // hard cap: never longer than 1s
function readyToReveal() { setTimeout(hideLoader, Math.max(0, 450 - (performance.now() - t0))); }   // short minimum so it never flashes

const card = html => { $('card').innerHTML = html; };
const stateCard = (emoji, title, msg, extra = '') => card(`<div class="state"><div class="big">${emoji}</div><h1>${title}</h1><p class="muted">${msg}</p></div>${extra}`);

/* ── Session helpers (shapes enforced by Firestore rules → landingSessions) ── */
const genCode = (jobId, uid) => {
  const a = jobId.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4).padEnd(4, 'X');
  const b = uid.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4).padEnd(4, 'X');
  const r = new Uint8Array(2); crypto.getRandomValues(r);
  return `WH-${a}-${b}-${Array.from(r, x => x.toString(16).padStart(2, '0')).join('').toUpperCase()}`;   // matches ^WH-[A-Z0-9]{1,4}-[A-Z0-9]{1,4}-[A-F0-9]{4}$
};

onAuthStateChanged(auth, async user => {
  try {
    if (!JOB_ID) { stateCard('⚠️', 'Invalid link', 'এই লিংকে কোনো টাস্ক আইডি নেই। WorkHive অ্যাপ থেকে আবার Start চাপুন।'); return; }
    if (!user) {
      stateCard('🔐', 'Login required', 'টাস্ক ভেরিফাই করতে আগে WorkHive-এ লগইন করুন, তারপর এই লিংকটি আবার খুলুন।', `<a class="btn" style="margin-top:16px" href="./">Open WorkHive</a>`);
      return;
    }
    const uid = user.uid;
    const jobSnap = await getDoc(doc(db, 'jobs', JOB_ID));
    if (!jobSnap.exists()) { stateCard('🔎', 'Task not found', 'টাস্কটি মুছে ফেলা হয়েছে বা আর নেই।'); return; }
    const job = jobSnap.data();
    if (job.type !== 'landing' || job.status !== 'approved') { stateCard('⏸️', 'Task unavailable', 'এই টাস্কটি এখন চালু নেই।'); return; }
    if ((job.filled || 0) >= (job.limit || Infinity)) { stateCard('🏁', 'Task full', 'এই টাস্কের সব স্লট পূর্ণ হয়ে গেছে।'); return; }

    const cdMs = (job.cooldownHours === 12 ? 12 : 24) * 3600000;
    const hist = await getDoc(doc(db, 'user_task_history', uid, 'jobs', JOB_ID)).catch(() => null);
    const last = hist && hist.exists() ? (hist.data().lastClaimedAt?.toMillis?.() || 0) : 0;
    if (last && Date.now() - last < cdMs) {
      const m = Math.ceil((cdMs - (Date.now() - last)) / 60000);
      stateCard('⏳', 'Cooldown active', `এই টাস্ক আবার করতে ${Math.floor(m / 60)} ঘণ্টা ${m % 60} মিনিট অপেক্ষা করুন।`);
      return;
    }
    renderTask(job, uid);
  } catch (e) {
    console.error(e);
    stateCard('❌', 'Something went wrong', 'লোড করতে সমস্যা হয়েছে (' + esc(e.code || e.message) + ')। পেজ রিফ্রেশ করুন।', `<button style="margin-top:16px" onclick="location.reload()">Retry</button>`);
  } finally { readyToReveal(); }
});

function renderTask(job, uid) {
  const secs = Math.max(10, Math.min(300, job.timerSeconds || 30));
  const ads = Object.values(job.adLinks || {}).filter(u => /^https:\/\//i.test(u));
  const sessRef = doc(db, 'landingSessions', JOB_ID + '_' + uid);
  const reward = '$' + (Number(job.reward) || 0).toFixed(2);
  card(`
    <h1>${esc(job.title || 'Verify your visit')}</h1>
    <p class="muted">${esc(job.desc || 'নিচের টাইমার শেষ হলে আপনার Secret Code দেখা যাবে — সেটি WorkHive অ্যাপে সাবমিট করলেই রিওয়ার্ড ব্যালেন্সে যোগ হবে।')}</p>
    <div class="badges">${b3('clock', 'Timer', secs + 's')}${b3('lock', 'Secure', 'Code')}${b3('coin', 'Reward', reward)}</div>
    <div id="stage"></div>`);
  const stage = $('stage');

  const begin = async () => {
    stage.innerHTML = `<div class="timer"><div class="num" id="tnum">${secs}</div></div><div class="bar"><i id="tbar"></i></div><p class="muted" style="text-align:center" id="tmsg">এই ট্যাবটি খোলা রাখুন…</p>`;
    try {
      // Always start a fresh server-timed session (rule: startedAt == request.time, no code, claimed false).
      await setDoc(sessRef, { uid, jobId: JOB_ID, startedAt: serverTimestamp(), claimed: false });
    } catch (e) { console.error(e); stage.innerHTML = `<p class="muted err">সেশন শুরু করা যায়নি (${esc(e.code || e.message)})।</p><button class="ghost" onclick="location.reload()">Retry</button>`; return; }
    let left = secs;                                   // counts only while this tab is visible
    const tick = setInterval(async () => {
      if (document.hidden) { $('tmsg').textContent = '⏸️ ট্যাবে ফিরে আসুন — টাইমার থেমে আছে'; return; }
      $('tmsg').textContent = 'এই ট্যাবটি খোলা রাখুন…';
      left--; $('tnum').textContent = Math.max(0, left); $('tbar').style.width = ((secs - left) / secs * 100) + '%';
      if (left > 0) return;
      clearInterval(tick); $('tmsg').textContent = 'কোড তৈরি হচ্ছে…';
      for (let tries = 0; tries < 4; tries++) {       // server clock must also have passed startedAt + timer
        try {
          const code = genCode(JOB_ID, uid);
          await updateDoc(sessRef, { code, codeAt: serverTimestamp() });
          showCode(code); return;
        } catch (e) {
          if (e.code !== 'permission-denied' || tries === 3) { console.error(e); stage.innerHTML = `<p class="muted err">কোড তৈরি ব্যর্থ (${esc(e.code || e.message)})।</p><button class="ghost" onclick="location.reload()">Restart</button>`; return; }
          await new Promise(r => setTimeout(r, 1500));
        }
      }
    }, 1000);
  };

  const showCode = code => {
    stage.innerHTML = `<p class="muted" style="text-align:center">✅ ভেরিফিকেশন সম্পন্ন — আপনার Secret Code</p>
      <div class="code" id="codeBox">${esc(code)}</div>
      <button id="copyBtn">Copy Code</button>
      <p class="muted" style="text-align:center;margin-top:12px">কোডটি কপি করে WorkHive অ্যাপের টাস্কে Paste করে <b>Verify &amp; Claim Reward</b> চাপুন।</p>
      <a class="btn ghost" style="margin-top:10px;box-shadow:none;background:rgba(255,255,255,.07);color:var(--ink);border:1px solid var(--glass-b)" href="./">Back to WorkHive</a>`;
    $('copyBtn').onclick = async () => { try { await navigator.clipboard.writeText(code); $('copyBtn').textContent = 'Copied ✓'; } catch { const r = document.createRange(); r.selectNodeContents($('codeBox')); getSelection().removeAllRanges(); getSelection().addRange(r); } };
  };

  // Resume an already-released, unclaimed code (page was closed before copying it).
  getDoc(sessRef).then(s => {
    if (s.exists() && s.data().code && s.data().claimed === false) { showCode(s.data().code); return; }
    if (ads.length) {
      stage.innerHTML = `<button id="goBtn">Continue &amp; Start Timer</button><p class="muted" style="text-align:center;margin-top:10px">Continue চাপলে স্পনসর লিংক(গুলো) ব্যাকগ্রাউন্ড ট্যাবে খুলবে, তারপর টাইমার শুরু হবে।</p>`;
      $('goBtn').onclick = () => { ads.forEach((u, i) => setTimeout(() => window.open(u, '_blank', 'noopener'), i * 400)); window.focus(); begin(); };
    } else begin();                                    // shortlink mode: the shortener already served the ads
  }).catch(() => ads.length ? null : begin());
}
</script>
</body>
</html>
